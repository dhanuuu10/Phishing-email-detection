<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phishing Email Detection Dashboard</title>
</head>

<body>

    <h1>Phishing Email Detection Dashboard</h1>

    <p>
        Analyze an email for potential phishing indicators.
    </p>

    <form action="/analyze" method="POST">

        <label for="sender">Sender Email:</label>
        <br>

        <input
            type="email"
            id="sender"
            name="sender"
            required
        >

        <br><br>

        <label for="subject">Email Subject:</label>
        <br>

        <input
            type="text"
            id="subject"
            name="subject"
            required
        >

        <br><br>

        <label for="email_body">Email Body:</label>
        <br>

        <textarea
            id="email_body"
            name="email_body"
            rows="12"
            cols="70"
            required
        ></textarea>

        <br><br>

        <button type="submit">
            Analyze Email
        </button>

    </form>

</body>
</html>
